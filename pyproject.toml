[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h1db"
version = "1.0.0"
description = "Build a local database of publicly disclosed HackerOne reports, direct from HackerOne's official API."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Gh0stSpy" }]
keywords = ["hackerone", "bug-bounty", "security", "disclosed-reports", "vulnerability"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Deliberately zero runtime dependencies: the whole tool is stdlib, so it runs
# on a bare Kali box with nothing but python3 installed.
dependencies = []

[project.scripts]
h1db = "h1db.__main__:main"

[project.urls]
Homepage = "https://github.com/Gh0stSpy/HackerOne-Disclosed-Reports-Database"

[tool.setuptools]
packages = ["h1db"]
